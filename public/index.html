<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>তামান্না AI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f2f2f2; display: flex; justify-content: center; height: 100vh; }
    .app { width: 100%; max-width: 600px; height: 100vh; background: white; display: flex; flex-direction: column; }
    header { background: #111; color: white; padding: 18px; text-align: center; font-size: 22px; font-weight: bold; }
    #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
    .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background: #e9e9eb; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
    .input-area { display: flex; padding: 12px; background: #fff; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 15px; }
    button { background: #007bff; color: white; border: none; padding: 10px 18px; margin-left: 8px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="app">
    <header>তামান্না AI</header>
    <div id="chat-box">
      <div class="msg bot">হ্যালো! আমি তামান্না AI। তোমাকে কীভাবে সাহায্য করতে পারি?</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="এখানে মেসেজ লিখুন...">
      <button onclick="sendMessage()">পাঠান</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chat-box');
      const text = input.value.trim();
      if (!text) return;

      chatBox.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        chatBox.innerHTML += `<div class="msg bot">${data.reply || data.error}</div>`;
      } catch (err) {
        chatBox.innerHTML += `<div class="msg bot">দুঃখিত, সংযোগে সমস্যা হচ্ছে!</div>`;
      }
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
